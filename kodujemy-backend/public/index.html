<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kodujemy - Nauka programowania</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
    <style>
        :root {
            --bg-body: #f3f4f6;
            --bg-panel: #ffffff;
            --bg-editor: #1e1e1e;
            --bg-tests: #252526;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --text-editor: #d4d4d4;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --border: #e5e7eb;
            --border-editor: #333333;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .editor-pane ::-webkit-scrollbar-thumb,
        .code-area::-webkit-scrollbar-thumb,
        .tests-pane ::-webkit-scrollbar-thumb { background: #4b5563; }

        /* Navbar */
        header.navbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 30px; background-color: var(--bg-panel); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.5px; cursor: pointer; }
        .nav-links { display: flex; gap: 30px; }
        .nav-links a { text-decoration: none; color: var(--text-muted); font-size: 16px; font-weight: 500; transition: color 0.2s; cursor: pointer; background: none; border: none; padding: 0; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        .user-panel { display: flex; align-items: center; gap: 15px; }
        .badge { background: var(--bg-body); color: var(--text-main); padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: 600; border: 1px solid var(--border); }
        .badge-xp { color: var(--primary); border-color: #c7d2fe; background: #e0e7ff; }
        .avatar { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), #8b5cf6); color: white; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 18px; cursor: pointer; }

        /* Container */
        .container { display: flex; max-width: 1400px; margin: 0 auto; padding: 30px; gap: 30px; }
        .main-content { flex: 7; min-width: 0; }
        .sidebar { flex: 3; display: flex; flex-direction: column; gap: 30px; min-width: 0; }
        .full-page { max-width: 1400px; margin: 0 auto; padding: 30px; }

        /* Headings */
        h2 { font-weight: 600; font-size: 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; color: var(--text-main); }
        h2::before { content: ""; display: block; width: 4px; height: 20px; background-color: var(--primary); border-radius: 2px; }
        h1.page-title { font-size: 32px; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
        .page-subtitle { font-size: 16px; color: var(--text-muted); margin-bottom: 30px; }

        /* Cards (paths) */
        .cards-wrapper { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .card { background-color: var(--bg-panel); padding: 25px; border-radius: var(--radius); transition: transform 0.2s; position: relative; border: 1px solid var(--border); cursor: pointer; }
        .card:hover { transform: translateY(-3px); border-color: #c7d2fe; }
        .card h3 { font-weight: 600; font-size: 20px; margin-bottom: 15px; padding-right: 75px; }
        .card-stats { display: flex; gap: 25px; }
        .stat { display: flex; flex-direction: column; font-size: 13px; color: var(--text-muted); }
        .stat-val { font-size: 24px; font-weight: 700; color: var(--text-main); margin-top: 4px; }
        .circle { width: 60px; height: 60px; border: 4px solid var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: 700; font-size: 16px; position: absolute; right: 25px; top: 25px; color: var(--primary); }
        .circle.empty { border-color: #e5e7eb; color: #9ca3af; }

        /* Activity */
        .activity-list { display: flex; flex-direction: column; gap: 15px; }
        .activity-item { display: flex; align-items: center; justify-content: space-between; background-color: var(--bg-panel); padding: 15px 20px; border-radius: var(--radius); border: 1px solid var(--border); transition: background 0.2s; cursor: pointer; }
        .activity-item:hover { background-color: #f9fafb; }
        .activity-left { display: flex; align-items: center; gap: 15px; }
        .activity-icon { width: 40px; height: 40px; background: #e0e7ff; color: var(--primary); border-radius: 10px; display: flex; justify-content: center; align-items: center; font-weight: bold; }
        .activity-text h4 { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
        .activity-text p { font-size: 13px; color: var(--text-muted); }
        .activity-xp { color: var(--success); font-weight: 700; font-size: 16px; background: #d1fae5; padding: 4px 10px; border-radius: 20px; white-space: nowrap; }

        /* Daily challenge */
        .daily-challenge { background: linear-gradient(135deg, var(--primary), #8b5cf6); border-radius: var(--radius); padding: 25px; color: white; text-align: center; position: relative; overflow: hidden; }
        .daily-challenge::before { content: "⭐"; position: absolute; font-size: 100px; opacity: 0.1; right: -20px; top: -20px; }
        .daily-challenge h3 { font-weight: 700; font-size: 22px; margin-bottom: 8px; position: relative; z-index: 1; }
        .daily-challenge p { font-size: 14px; margin-bottom: 20px; color: #e0e7ff; position: relative; z-index: 1; }
        .daily-challenge button { background-color: white; color: var(--primary); border: none; padding: 10px 20px; font-size: 15px; font-weight: 600; border-radius: 25px; cursor: pointer; transition: transform 0.2s; position: relative; z-index: 1; }
        .daily-challenge button:hover { transform: scale(1.05); }

        /* Sidebar - Ranking */
        .ranking-card { background: var(--bg-panel); border-radius: var(--radius); padding: 25px; border: 1px solid var(--border); }
        .ranking-list { display: flex; flex-direction: column; gap: 15px; }
        .ranking-item { display: flex; align-items: center; gap: 15px; padding-bottom: 10px; border-bottom: 1px solid #f3f4f6; }
        .ranking-item:last-child { border-bottom: none; padding-bottom: 0; }
        .ranking-avatar { width: 35px; height: 35px; background-color: var(--text-muted); border-radius: 50%; color: white; display: flex; justify-content: center; align-items: center; font-size: 14px; font-weight: bold; flex-shrink: 0; }
        .ranking-info { display: flex; flex-direction: column; min-width: 0; }
        .ranking-name { font-weight: 600; font-size: 14px; }
        .ranking-points { font-size: 12px; color: var(--text-muted); }
        .empty-state { text-align: center; padding: 30px 15px; color: var(--text-muted); font-size: 14px; }
        .empty-state-icon { font-size: 36px; margin-bottom: 10px; opacity: 0.5; }

        /* Task list */
        .filters-bar { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; align-items: center; }
        .filter-btn { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-panel); color: var(--text-muted); font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .filter-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }
        .search-input { flex: 1; min-width: 200px; padding: 9px 14px; border-radius: 20px; border: 1px solid var(--border); font-size: 14px; outline: none; transition: border-color 0.2s; }
        .search-input:focus { border-color: var(--primary); }

        .task-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
        .task-row { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; gap: 15px; }
        .task-row:hover { border-color: #c7d2fe; transform: translateX(2px); }
        .task-row-left { display: flex; align-items: center; gap: 16px; min-width: 0; flex: 1; }
        .task-status { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #f3f4f6; color: #9ca3af; font-weight: bold; }
        .task-status.done { background: #d1fae5; color: var(--success); }
        .task-info { min-width: 0; }
        .task-name { font-weight: 600; font-size: 16px; margin-bottom: 3px; }
        .task-meta { font-size: 13px; color: var(--text-muted); }
        .task-row-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .difficulty { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .difficulty.easy { background: #d1fae5; color: #047857; }
        .difficulty.medium { background: #fef3c7; color: #b45309; }
        .difficulty.hard { background: #fee2e2; color: #b91c1c; }
        .task-xp { font-size: 13px; color: var(--primary); font-weight: 600; }

        /* Courses */
        .course-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 25px; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; gap: 15px; }
        .course-card:hover { transform: translateY(-3px); border-color: #c7d2fe; }
        .course-header { display: flex; align-items: center; gap: 15px; }
        .course-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: white; flex-shrink: 0; }
        .course-title { font-size: 18px; font-weight: 700; margin-bottom: 3px; }
        .course-subtitle { font-size: 13px; color: var(--text-muted); }
        .course-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
        .progress-bar { background: #f3f4f6; border-radius: 10px; height: 8px; overflow: hidden; margin-top: 5px; }
        .progress-fill { background: linear-gradient(90deg, var(--primary), #8b5cf6); height: 100%; transition: width 0.5s; }
        .progress-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); }
        .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }

        /* Editor page */
        .editor-page { display: flex; flex-direction: column; height: calc(100vh - 70px); overflow: hidden; }
        .workspace { display: flex; flex: 1; overflow: hidden; }
        .task-pane { width: 40%; min-width: 320px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background-color: var(--bg-panel); }
        .tabs { display: flex; border-bottom: 1px solid var(--border); background: #f8fafc; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 14px; font-weight: 600; color: #64748b; cursor: pointer; transition: 0.2s; border: none; background: transparent; }
        .tab.active { color: var(--primary); background: var(--bg-panel); border-bottom: 2px solid var(--primary); }
        .tab:hover:not(.active) { color: var(--text-main); background: #f1f5f9; }
        .task-content { padding: 30px; overflow-y: auto; flex: 1; }
        .task-content h1 { font-size: 26px; margin-bottom: 15px; color: var(--text-main); }
        .task-content p { font-size: 15px; line-height: 1.6; margin-bottom: 20px; color: #475569; }
        .code-inline { background: #f1f5f9; color: #db2777; padding: 2px 6px; border-radius: 4px; font-family: 'Consolas', monospace; font-size: 14px; }
        .example-box { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 20px; overflow: hidden; }
        .example-header { padding: 8px 15px; background: #f8fafc; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 13px; color: #475569; }
        .example-body { padding: 15px; display: flex; flex-direction: column; gap: 10px; font-family: 'Consolas', monospace; font-size: 14px; }
        .example-row { display: flex; }
        .example-label { width: 80px; color: #64748b; font-weight: bold; flex-shrink: 0; }
        .example-val { color: var(--text-main); word-break: break-all; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--primary); font-size: 14px; font-weight: 500; margin-bottom: 15px; cursor: pointer; }
        .back-link:hover { text-decoration: underline; }

        .editor-container { width: 60%; display: flex; flex-direction: column; min-width: 0; }
        .editor-header { padding: 10px 20px; background: #252526; border-bottom: 1px solid var(--border-editor); display: flex; justify-content: space-between; align-items: center; color: white; gap: 10px; }
        .lang-select {
            background: linear-gradient(180deg, #3a3d41, #2d2f33);
            color: #ffffff;
            border: 1px solid #4a4d52;
            padding: 6px 28px 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%23bbb' d='M0 0l5 6 5-6z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }
        .lang-select:hover { border-color: #6366f1; }
        .header-actions { display: flex; gap: 10px; align-items: center; }
        .header-status {
            font-size: 12px;
            color: #cfcfcf;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #2d2d2d;
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid #3a3a3a;
        }
        .header-status .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; display: inline-block; }
        .header-status.ready .dot { background: var(--success); box-shadow: 0 0 6px rgba(16, 185, 129, 0.7); }
        .header-status.loading .dot { background: var(--warning); animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .btn-run { background: var(--success); color: white; border: none; padding: 6px 16px; border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-run:hover { background: #059669; }
        .btn-run:disabled { background: #6b7280; cursor: not-allowed; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 6px 16px; border-radius: 5px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .btn-submit:hover { background: var(--primary-hover); }
        .btn-submit:disabled { background: #6b7280; cursor: not-allowed; }

        .code-area { flex: 1; background-color: var(--bg-editor); overflow: hidden; position: relative; display: flex; min-height: 0; }
        /* Wspólne wymiary edytora — textarea i warstwa kolorująca MUSZĄ je dzielić, inaczej tekst się rozjedzie */
        .code-editor-wrap { position: relative; flex: 1; overflow: hidden; }
        .code-textarea,
        .code-highlight {
            position: absolute; inset: 0;
            margin: 0; border: 0;
            padding: 15px 20px 15px 60px;
            /* WAŻNE: identyczny stack fontowy w obu warstwach - inaczej kursor się rozjeżdża */
            font-family: ui-monospace, 'Menlo', 'Cascadia Code', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
            font-size: 15px;
            font-weight: 400;
            font-style: normal;
            font-variant-ligatures: none;       /* bez ligatur - inaczej "==" i "->" miałyby inne metryki */
            letter-spacing: 0;
            line-height: 1.5;
            tab-size: 4;
            -moz-tab-size: 4;
            white-space: pre;
            overflow: auto;
            box-sizing: border-box;
            -webkit-font-smoothing: auto;       /* spójne anty-aliasingi w obu warstwach */
            text-rendering: geometricPrecision; /* wymusza identyczne metryki znaków */
        }
        .code-textarea {
            background: transparent;
            color: transparent;            /* tekst niewidoczny — kolor robi warstwa pod spodem */
            caret-color: #ffffff;          /* ale kursor zostawiamy widoczny */
            outline: none;
            resize: none;
            z-index: 2;
        }
        .code-textarea::selection { background: rgba(99, 102, 241, 0.35); color: transparent; }
        .code-highlight {
            pointer-events: none;
            z-index: 1;
            color: var(--text-editor);
        }
        .code-highlight code {
            font: inherit;
            font-weight: inherit;
            font-style: inherit;
            white-space: pre;
            display: block;
            min-height: 100%;
        }
        /* Wszystkie tokeny dziedziczą metryki - tylko kolor się zmienia */
        .code-highlight span {
            font: inherit;
            font-weight: 400 !important;
            font-style: normal !important;
            letter-spacing: 0 !important;
        }

        /* Kolorowanie składni Pythona (paleta inspirowana VS Code Dark+) */
        .tok-kw   { color: #569cd6; }            /* słowa kluczowe: def, return, if, for, ... */
        .tok-def  { color: #569cd6; }            /* def/class - bez bold (rozjeżdżałoby kursor) */
        .tok-bi   { color: #4ec9b0; }            /* wbudowane: int, bool, print, len, ... */
        .tok-str  { color: #ce9178; }            /* napisy */
        .tok-num  { color: #b5cea8; }            /* liczby */
        .tok-com  { color: #6a9955; }            /* komentarze - bez italic (rozjeżdżałoby kursor) */
        .tok-fn   { color: #dcdcaa; }            /* nazwy funkcji */
        .tok-op   { color: #d4d4d4; }            /* operatory */
        .tok-dec  { color: #c586c0; }            /* dekoratory */
        .tok-self { color: #9cdcfe; }            /* self - bez italic */

        .line-numbers {
            position: absolute; left: 0; top: 0; bottom: 0; width: 50px;
            padding: 15px 8px 15px 0;
            background: var(--bg-editor);
            color: #858585;
            font-family: ui-monospace, 'Menlo', 'Cascadia Code', 'Consolas', 'Liberation Mono', 'Courier New', monospace;
            font-size: 15px;
            font-weight: 400;
            line-height: 1.5;
            text-align: right;
            user-select: none;
            border-right: 1px solid #404040;
            pointer-events: none;
            overflow: hidden;
            white-space: pre;              /* <- KLUCZOWE: bez tego "1\n2" renderuje się jako "1 2" */
            z-index: 3;
        }

        .tests-pane { height: 38%; min-height: 200px; background-color: var(--bg-tests); border-top: 1px solid var(--border-editor); display: flex; flex-direction: column; color: white; }
        .tests-header { display: flex; align-items: center; padding: 10px 20px; background: #2d2d2d; gap: 10px; border-bottom: 1px solid var(--border-editor); flex-wrap: wrap; }
        .tests-header span.tests-label { font-size: 13px; font-weight: bold; text-transform: uppercase; color: #ccc; margin-right: 10px; }
        .test-pill { padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: bold; border: 1px solid transparent; background: #3c3c3c; color: #ccc; }
        .test-pill.pass { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success); }
        .test-pill.fail { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: var(--danger); }
        .test-pill.running { background: rgba(245, 158, 11, 0.15); border-color: var(--warning); color: var(--warning); }
        .console-output { padding: 15px 20px; font-family: 'Consolas', monospace; font-size: 13px; overflow-y: auto; flex: 1; }
        .console-line { margin-bottom: 8px; display: flex; gap: 10px; align-items: flex-start; }
        .icon-pass { color: var(--success); flex-shrink: 0; }
        .icon-fail { color: var(--danger); flex-shrink: 0; }
        .icon-info { color: #60a5fa; flex-shrink: 0; }
        .console-empty { color: #888; font-style: italic; }
        .console-error { color: var(--danger); white-space: pre-wrap; }

        /* Toast */
        .toast { position: fixed; bottom: 30px; right: 30px; background: var(--bg-panel); border: 1px solid var(--border); border-left: 4px solid var(--success); padding: 16px 22px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); z-index: 1000; animation: slideIn 0.3s ease; max-width: 360px; }
        .toast.error { border-left-color: var(--danger); }
        .toast.info { border-left-color: var(--primary); }
        .toast-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
        .toast-msg { font-size: 13px; color: var(--text-muted); }
        @keyframes slideIn { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* Loading overlay */
        .loading-screen { position: fixed; inset: 0; background: var(--bg-body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; z-index: 9999; }
        .spinner { width: 44px; height: 44px; border: 4px solid #e5e7eb; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 14px; color: var(--text-muted); }

        /* Course detail */
        .lessons-list { display: flex; flex-direction: column; gap: 10px; }
        .lesson-item { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
        .lesson-item:hover { border-color: #c7d2fe; }
        .lesson-num { width: 32px; height: 32px; border-radius: 50%; background: #f3f4f6; color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
        .lesson-num.done { background: #d1fae5; color: var(--success); }
        .lesson-name { flex: 1; font-weight: 500; font-size: 15px; }
        .lesson-xp { font-size: 13px; color: var(--primary); font-weight: 600; }

        /* ====== Avatar + dropdown menu ====== */
        .avatar-wrapper { position: relative; }

const TOKEN_STORAGE_KEY = 'kodujemy_token';

const API = {
    getToken() {
        try { return localStorage.getItem(TOKEN_STORAGE_KEY) || null; }
        catch { return null; }
    },
    setToken(t) {
        try {
            if (t) localStorage.setItem(TOKEN_STORAGE_KEY, t);
            else localStorage.removeItem(TOKEN_STORAGE_KEY);
        } catch {}
    },
    async request(path, { method = 'GET', body = null, auth = true } = {}) {
        const headers = { 'Content-Type': 'application/json' };
        if (auth) {
            const t = this.getToken();
            if (t) headers['Authorization'] = 'Bearer ' + t;
        }
        const opts = { method, headers };
        if (body) opts.body = JSON.stringify(body);
        const res = await fetch(path, opts);
        const text = await res.text();
        let data = null;
        try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
        if (!res.ok) {
            const err = new Error((data && data.error) || `HTTP ${res.status}`);
            err.status = res.status;
            err.data = data;
            throw err;
        }
        return data;
    },
    // Auth
    register({ name, email, password }) {
        return this.request('/api/auth/register', { method: 'POST', body: { name, email, password }, auth: false });
    },
    login({ email, password }) {
        return this.request('/api/auth/login', { method: 'POST', body: { email, password }, auth: false });
    },
    session() {
        return this.request('/api/auth/session');
    },
    logout() {
        return this.request('/api/auth/logout', { method: 'POST' });
    },
    // Akcje uzytkownika

        return this.request('/api/solve-task', { method: 'POST', body: { taskId, title, category, xp } });

        return this.request('/api/complete-lesson', {
            method: 'POST',

    saveCode({ taskId, code }) {
        return this.request('/api/save-code', { method: 'POST', body: { taskId, code } });

        return this.request('/api/save-playground', { method: 'POST', body: { code } });

// ============================================================
function Toast({ toast, onClose }) {
    useEffect(() => {
        if (!toast) return;
        const t = setTimeout(onClose, 3500);
        return () => clearTimeout(t);
    }, [toast]);
    if (!toast) return null;
    return (
        <div className={`toast ${toast.type || ''}`}>
            <div className="toast-title">{toast.title}</div>
            {toast.message && <div className="toast-msg">{toast.message}</div>}
        </div>
    );
}

function formatTime(ts) {
    const diff = Date.now() - ts;
    const min = Math.floor(diff / 60000);
    if (min < 1) return 'przed chwilą';
    if (min < 60) return `${min} min temu`;
    const hr = Math.floor(min / 60);
    if (hr < 24) return `${hr} ${hr === 1 ? 'godzinę' : hr < 5 ? 'godziny' : 'godzin'} temu`;
    const days = Math.floor(hr / 24);
    if (days === 1) return 'wczoraj';
    return `${days} dni temu`;
}

// ============================================================
// Koloryzacja składni Pythona (lekki tokenizer — nie wymaga zewnętrznej biblioteki)
// ============================================================
const PY_KEYWORDS = new Set([
    'False','None','True','and','as','assert','async','await','break','class','continue',
    'def','del','elif','else','except','finally','for','from','global','if','import','in',
    'is','lambda','nonlocal','not','or','pass','raise','return','try','while','with','yield','match','case'
]);
const PY_BUILTINS = new Set([
    'abs','all','any','ascii','bin','bool','bytearray','bytes','callable','chr','classmethod',
    'compile','complex','dict','dir','divmod','enumerate','eval','exec','filter','float','format',
    'frozenset','getattr','globals','hasattr','hash','help','hex','id','input','int','isinstance',
    'issubclass','iter','len','list','locals','map','max','min','next','object','oct','open','ord',
    'pow','print','property','range','repr','reversed','round','set','setattr','slice','sorted',
    'staticmethod','str','sum','super','tuple','type','vars','zip','__import__'
]);

function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightPython(src) {
    // Tokenizer rozpoznający: komentarze, stringi (' " """ '''), liczby, słowa kluczowe,
    // wbudowane, dekoratory, nazwy funkcji (po `def`) i wywoływanych funkcji (przed `(`).
    let out = '';
    let i = 0;
    const n = src.length;
    const isIdStart = c => /[A-Za-z_]/.test(c);
    const isIdCont  = c => /[A-Za-z0-9_]/.test(c);
    const isDigit   = c => /[0-9]/.test(c);

    let expectFuncName = false; // true tuż po słowie `def` (lub `class`)

    while (i < n) {
        const c = src[i];

        // Komentarz do końca linii
        if (c === '#') {
            let j = i;
            while (j < n && src[j] !== '\n') j++;
            out += `<span class="tok-com">${escapeHtml(src.slice(i, j))}</span>`;
            i = j;
            continue;
        }

        // Stringi: """...""", '''...''', "...", '...'
        if (c === '"' || c === "'") {
            const triple = src.slice(i, i + 3);
            if (triple === '"""' || triple === "'''") {
                const quote = triple;
                let j = i + 3;
                while (j < n && src.slice(j, j + 3) !== quote) j++;
                j = Math.min(j + 3, n);
                out += `<span class="tok-str">${escapeHtml(src.slice(i, j))}</span>`;
                i = j;
                continue;
            } else {
                let j = i + 1;
                while (j < n && src[j] !== c && src[j] !== '\n') {
                    if (src[j] === '\\' && j + 1 < n) j += 2; else j++;
                }
                if (j < n && src[j] === c) j++;
                out += `<span class="tok-str">${escapeHtml(src.slice(i, j))}</span>`;
                i = j;
                continue;
            }
        }

        // Liczby
        if (isDigit(c) || (c === '.' && i + 1 < n && isDigit(src[i + 1]))) {
            let j = i;
            while (j < n && /[0-9_.eExXoObBjJ+\-]/.test(src[j])) {
                // ograniczamy +/- tylko bezpośrednio po e/E (notacja wykładnicza)
                if ((src[j] === '+' || src[j] === '-') && !/[eE]/.test(src[j-1])) break;
                j++;
            }
            out += `<span class="tok-num">${escapeHtml(src.slice(i, j))}</span>`;
            i = j;
            continue;
        }

        // Dekoratory: @nazwa
        if (c === '@' && i + 1 < n && isIdStart(src[i+1])) {
            let j = i + 1;
            while (j < n && isIdCont(src[j])) j++;
            out += `<span class="tok-dec">${escapeHtml(src.slice(i, j))}</span>`;
            i = j;
            continue;
        }

        // Identyfikatory / słowa kluczowe / wbudowane
        if (isIdStart(c)) {
            let j = i;
            while (j < n && isIdCont(src[j])) j++;
            const word = src.slice(i, j);

            // Pomiń białe znaki, sprawdź czy następny niebiały to '('
            let k = j;
            while (k < n && (src[k] === ' ' || src[k] === '\t')) k++;
            const isCall = src[k] === '(';

            let cls;
            if (expectFuncName) {
                cls = 'tok-fn';
                expectFuncName = false;
            } else if (word === 'self' || word === 'cls') {
                cls = 'tok-self';
            } else if (PY_KEYWORDS.has(word)) {
                cls = (word === 'def' || word === 'class') ? 'tok-def' : 'tok-kw';
                if (word === 'def' || word === 'class') expectFuncName = true;
            } else if (PY_BUILTINS.has(word)) {
                cls = 'tok-bi';
            } else if (isCall) {
                cls = 'tok-fn';
            } else {
                cls = null;
            }

            out += cls ? `<span class="${cls}">${escapeHtml(word)}</span>` : escapeHtml(word);
            i = j;
            continue;
        }

        // Operatory i nawiasy
        if (/[+\-*/%=<>!&|^~]/.test(c)) {
            out += `<span class="tok-op">${escapeHtml(c)}</span>`;
            i++;
            continue;
        }

        // Wszystko inne: dosłownie (białe znaki, przecinki, nawiasy, dwukropki itp.)
        if (c === '\n') {
            out += '\n';
        } else {
            out += escapeHtml(c);
        }
        i++;
    }

    // Trailing newline gwarantuje, że ostatnia linia nie zostanie "przycięta" przy przewijaniu
    if (!out.endsWith('\n')) out += '\n';
    return out;
}

// EDYTOR - rozwiązywanie zadania
// ============================================================
function EditorPage({ taskId, setPage, solveTask, savedCode, saveCode }) {
    const task = TASKS.find(t => t.id === taskId);
    const [code, setCode] = useState(savedCode || task?.starterCode || '');
    const [tab, setTab] = useState('task');
    const [testResults, setTestResults] = useState([]); // [{idx, status: 'pass'|'fail'|'running', input, got, expected, error}]
    const [consoleMsgs, setConsoleMsgs] = useState([]);
    const [running, setRunning] = useState(false);
    const [pyodideReady, setPyodideReady] = useState(!!pyodideInstance);
    const [pyodideLoading, setPyodideLoading] = useState(false);
    const codeRef = useRef(code);
    const lineNumbersRef = useRef(null);
    const textareaRef = useRef(null);
    const highlightRef = useRef(null);

    useEffect(() => { codeRef.current = code; }, [code]);

    // Autozapis
    useEffect(() => {
        if (!task) return;
        const t = setTimeout(() => saveCode(task.id, code), 600);
        return () => clearTimeout(t);
    }, [code, task]);

    // Pyodide preload
    useEffect(() => {
        if (pyodideInstance) { setPyodideReady(true); return; }
        setPyodideLoading(true);
        getPyodide().then(() => {
            setPyodideReady(true);
            setPyodideLoading(false);
        }).catch(e => {
            setPyodideLoading(false);
            setConsoleMsgs([{type:'error', text:'Nie udało się załadować środowiska Pythona: ' + e.message}]);
        });
    }, []);

    // Sync scroll line numbers + warstwa kolorująca <-> textarea
    const onScrollTextarea = () => {
        const ta = textareaRef.current;
        if (!ta) return;
        if (lineNumbersRef.current) lineNumbersRef.current.scrollTop = ta.scrollTop;
        if (highlightRef.current) {
            highlightRef.current.scrollTop = ta.scrollTop;
            highlightRef.current.scrollLeft = ta.scrollLeft;
        }
    };

    // Tab handler
    const onKeyDownTextarea = (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const ta = textareaRef.current;
            const start = ta.selectionStart, end = ta.selectionEnd;
            const newCode = code.substring(0, start) + '    ' + code.substring(end);
            setCode(newCode);
            setTimeout(() => { ta.selectionStart = ta.selectionEnd = start + 4; }, 0);
        }
    };

    if (!task) {
        return (
            <div className="full-page">
                <a className="back-link" onClick={() => setPage({ name: 'tasks' })}>← Wróć do listy zadań</a>
                <div className="empty-state">Zadanie nie istnieje.</div>
            </div>
        );
    }

    const lineNums = Array.from({ length: Math.max(code.split('\n').length, 1) }, (_, i) => i + 1).join('\n');

    const runCode = async (submit = false) => {
        if (!pyodideReady || running) return;
        setRunning(true);
        setConsoleMsgs([{ type: 'info', text: '▶ Uruchamiam testy...' }]);
        setTestResults(task.testCases.map((_, i) => ({ idx: i, status: 'running' })));

        try {
            const py = await getPyodide();
            // Usuń poprzednią definicję funkcji (gdyby istniała) - świeży namespace
            try {
                py.runPython(`
if '${task.funcName}' in globals():
    del globals()['${task.funcName}']
`);
            } catch {}
            // Define user's code
            let userError = null;
            try {
                py.runPython(codeRef.current);
            } catch (e) {
                userError = e.message;
            }
            if (userError) {
                setTestResults([]);
                setConsoleMsgs([{ type: 'error', text: 'Błąd w kodzie:\n' + userError }]);
                setRunning(false);
                return;
            }

            // Check function exists
            let fnExists = false;
            try {
                fnExists = py.runPython(`callable(globals().get('${task.funcName}'))`);
            } catch {}
            if (!fnExists) {
                setTestResults([]);
                setConsoleMsgs([{ type: 'error', text: `Nie zdefiniowano funkcji '${task.funcName}'.` }]);
                setRunning(false);
                return;
            }

            const results = [];
            const consoleOut = [];
            let allPassed = true;
            for (let i = 0; i < task.testCases.length; i++) {
                const tc = task.testCases[i];
                try {
                    // Convert JS args to Python expression
                    const argsExpr = tc.input.map(a => JSON.stringify(a)).join(', ');
                    const callExpr = `${task.funcName}(${argsExpr})`;
                    const rawResult = py.runPython(`import json; json.dumps(${callExpr}, default=str)`);
                    const got = JSON.parse(rawResult);
                    const ok = deepEqual(got, tc.expected);
                    results.push({ idx: i, status: ok ? 'pass' : 'fail', input: tc.input, got, expected: tc.expected });
                    if (!ok) allPassed = false;
                    consoleOut.push({
                        type: ok ? 'pass' : 'fail',
                        text: `Wynik dla ${task.funcName}(${argsExpr}): Zwrócono ${JSON.stringify(got)}${ok ? '' : ` (oczekiwano: ${JSON.stringify(tc.expected)})`}`
                    });
                } catch (e) {
                    allPassed = false;
                    results.push({ idx: i, status: 'fail', input: tc.input, error: e.message, expected: tc.expected });
                    consoleOut.push({ type: 'fail', text: `Wyjątek dla ${task.funcName}(${tc.input.map(a => JSON.stringify(a)).join(', ')}): ${e.message.split('\n').pop()}` });
                }
            }
            setTestResults(results);
            setConsoleMsgs(consoleOut);

            if (submit && allPassed) {
                solveTask(task);
            } else if (submit && !allPassed) {
                setConsoleMsgs([...consoleOut, { type: 'error', text: 'Nie wszystkie testy przeszły. Popraw kod i spróbuj ponownie.' }]);
            }
        } catch (e) {
            setConsoleMsgs([{ type: 'error', text: 'Nieoczekiwany błąd: ' + e.message }]);
        } finally {
            setRunning(false);
        }
    };

    const diffLabel = { easy: 'Łatwy', medium: 'Średni', hard: 'Trudny' };

    return (
        <div className="editor-page">
            <div className="workspace">
                <div className="task-pane">
                    <div className="tabs">
                        <button className={`tab ${tab === 'task' ? 'active' : ''}`} onClick={() => setTab('task')}>Treść zadania</button>
                        <button className={`tab ${tab === 'solution' ? 'active' : ''}`} onClick={() => setTab('solution')}>Rozwiązanie</button>
                        <button className={`tab ${tab === 'discussion' ? 'active' : ''}`} onClick={() => setTab('discussion')}>Dyskusja</button>
                    </div>
                    <div className="task-content">
                        <a className="back-link" onClick={() => setPage({ name: 'tasks' })}>← Wszystkie zadania</a>
                        {tab === 'task' && (
                            <>
                                <h1>{task.title}</h1>
                                <div style={{display:'flex', gap:'8px', marginBottom:'18px'}}>
                                    <span className={`difficulty ${task.difficulty}`}>{diffLabel[task.difficulty]}</span>
                                    <span className="task-xp" style={{padding:'4px 10px', background:'#e0e7ff', borderRadius:'12px'}}>+{task.xp} XP</span>
                                </div>
                                {task.description.split('\n').map((p, i) => (
                                    <p key={i} dangerouslySetInnerHTML={{ __html: p.replace(/`([^`]+)`/g, '<span class="code-inline">$1</span>') }}></p>
                                ))}
                                {task.examples.map((ex, i) => (
                                    <div className="example-box" key={i}>
                                        <div className="example-header">Przykład {i + 1}</div>
                                        <div className="example-body">
                                            <div className="example-row"><span className="example-label">Wejście:</span><span className="example-val">{ex.input}</span></div>
                                            <div className="example-row"><span className="example-label">Wyjście:</span><span className="example-val code-inline">{ex.output}</span></div>
                                        </div>
                                    </div>
                                ))}
                            </>
                        )}
                        {tab === 'solution' && (
                            <div className="empty-state">
                                <div className="empty-state-icon">🔒</div>
                                <div>Rozwiąż zadanie, aby zobaczyć przykładowe rozwiązanie.</div>
                            </div>
                        )}
                        {tab === 'discussion' && (
                            <div className="empty-state">
                                <div className="empty-state-icon">💬</div>
                                <div>Brak postów w dyskusji. Bądź pierwszy!</div>
                            </div>
                        )}
                    </div>
                </div>

                <div className="editor-container">
                    <div className="editor-header">
                        <select className="lang-select" disabled>
                            <option>🐍 Python 3</option>
                        </select>
                        <div className="header-actions">
                            <span className={`header-status ${pyodideLoading ? 'loading' : pyodideReady ? 'ready' : ''}`}>
                                <span className="dot"></span>
                                {pyodideLoading ? 'Ładowanie Pythona...' : pyodideReady ? 'Gotowe' : 'Oczekiwanie...'}
                            </span>
                            <button className="btn-run" onClick={() => runCode(false)} disabled={!pyodideReady || running}>
                                {running ? 'Uruchamiam...' : '▶ Uruchom'}
                            </button>
                            <button className="btn-submit" onClick={() => runCode(true)} disabled={!pyodideReady || running}>
                                Zgłoś rozwiązanie
                            </button>
                        </div>
                    </div>

                    <div className="code-area">
                        <div className="line-numbers" ref={lineNumbersRef}>{lineNums}</div>
                        <div className="code-editor-wrap">
                            <pre
                                className="code-highlight"
                                ref={highlightRef}
                                aria-hidden="true"
                                dangerouslySetInnerHTML={{ __html: '<code>' + highlightPython(code) + '</code>' }}
                            />
                            <textarea
                                ref={textareaRef}
                                className="code-textarea"
                                value={code}
                                onChange={e => setCode(e.target.value)}
                                onScroll={onScrollTextarea}
                                onKeyDown={onKeyDownTextarea}
                                spellCheck={false}
                                autoCapitalize="off"
                                autoCorrect="off"
                            />
                        </div>
                    </div>

                    <div className="tests-pane">
                        <div className="tests-header">
                            <span className="tests-label">Wyniki Testów</span>
                            {testResults.length === 0
                                ? task.testCases.map((_, i) => <div className="test-pill" key={i}>Test {i + 1}</div>)
                                : testResults.map(r => (
                                    <div key={r.idx} className={`test-pill ${r.status}`}>
                                        Test {r.idx + 1}
                                        {r.status === 'pass' && ' ✓'}
                                        {r.status === 'fail' && ' ✕'}
                                    </div>
                                ))
                            }
                        </div>
                        <div className="console-output">
                            {consoleMsgs.length === 0 ? (
                                <div className="console-empty">Naciśnij ▶ Uruchom, aby przetestować swój kod.</div>
                            ) : consoleMsgs.map((m, i) => (
                                <div className="console-line" key={i}>
                                    {m.type === 'pass' && <span className="icon-pass">✓</span>}
                                    {m.type === 'fail' && <span className="icon-fail">✕</span>}
                                    {m.type === 'info' && <span className="icon-info">▶</span>}
                                    {m.type === 'error' ? (
                                        <span className="console-error">{m.text}</span>
                                    ) : (
                                        <span>{m.text}</span>
                                    )}
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    );
}

function deepEqual(a, b) {
    if (a === b) return true;
    if (typeof a !== typeof b) return false;
    if (Array.isArray(a) && Array.isArray(b)) {
        if (a.length !== b.length) return false;
        return a.every((v, i) => deepEqual(v, b[i]));
    }
    if (typeof a === 'object' && a !== null && b !== null) {
        const ka = Object.keys(a), kb = Object.keys(b);
        if (ka.length !== kb.length) return false;
        return ka.every(k => deepEqual(a[k], b[k]));
    }
    return false;
}

function LoginPage({ onLogin, switchToRegister }) {

            const data = await API.login({ email: email.trim(), password });

function RegisterPage({ onLogin, switchToLogin }) {
    const [name, setName] = useState('');
    const [email, setEmail] = useState('');
    const [password, setPassword] = useState('');
    const [password2, setPassword2] = useState('');
    const [agree, setAgree] = useState(false);
    const [errors, setErrors] = useState({});
    const [loading, setLoading] = useState(false);

    const validate = () => {
        const e = {};
        if (!name.trim() || name.trim().length < 2) e.name = 'Imię musi mieć co najmniej 2 znaki.';
        if (!email.trim()) e.email = 'Podaj adres e-mail.';
        else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.trim())) e.email = 'Nieprawidłowy format e-maila.';
        if (!password) e.password = 'Podaj hasło.';
        else if (password.length < 8) e.password = 'Hasło musi mieć co najmniej 8 znaków.';
        if (password !== password2) e.password2 = 'Hasła nie są identyczne.';
        if (!agree) e.agree = 'Musisz zaakceptować regulamin.';
        return e;
    };

    const submit = async () => {
        const eMap = validate();
        setErrors(eMap);
        if (Object.keys(eMap).length > 0) return;

        setLoading(true);
        try {
            const data = await API.register({
                name: name.trim(),
                email: email.trim(),
                password,
            });
            API.setToken(data.token);
            onLogin(data); // { token, user, activity, savedCodes }
        } catch (e) {
            if (e.status === 409) {
                setErrors({ email: 'Konto z tym e-mailem już istnieje.' });
            } else {
                setErrors({ general: 'Rejestracja nie powiodła się: ' + e.message });
            }
            setLoading(false);
        }
    };

    return (
        <div className="auth-page">
            <div className="auth-card">
                <div className="auth-logo">Kodujemy</div>
                <p className="auth-tagline">Naucz się programować przez praktykę</p>

                <h1 className="auth-title">Załóż konto</h1>
                <p className="auth-subtitle">Zacznij naukę za darmo. Twoje postępy będą zapisywane automatycznie.</p>

                <div className="form-group">
                    <label className="form-label">Imię (lub pseudonim)</label>
                    <input className={`form-input ${errors.name ? 'error' : ''}`} type="text"
                        value={name} onChange={e => setName(e.target.value)} placeholder="np. Jan" />
                    {errors.name && <div className="form-error">{errors.name}</div>}
                </div>
                <div className="form-group">
                    <label className="form-label">Adres e-mail</label>
                    <input className={`form-input ${errors.email ? 'error' : ''}`} type="email" autoComplete="email"
                        value={email} onChange={e => setEmail(e.target.value)} placeholder="np. jan@example.com" />
                    {errors.email && <div className="form-error">{errors.email}</div>}
                </div>
                <div className="form-group">
                    <label className="form-label">Hasło</label>
                    <input className={`form-input ${errors.password ? 'error' : ''}`} type="password" autoComplete="new-password"
                        value={password} onChange={e => setPassword(e.target.value)} placeholder="Co najmniej 8 znaków" />
                    {errors.password ? <div className="form-error">{errors.password}</div>
                        : <div className="form-hint">Minimum 8 znaków.</div>}
                </div>
                <div className="form-group">
                    <label className="form-label">Powtórz hasło</label>
                    <input className={`form-input ${errors.password2 ? 'error' : ''}`} type="password" autoComplete="new-password"
                        value={password2} onChange={e => setPassword2(e.target.value)} placeholder="Wpisz hasło ponownie" />
                    {errors.password2 && <div className="form-error">{errors.password2}</div>}
                </div>

                <div className="checkbox-row">
                    <input id="agree" type="checkbox" checked={agree} onChange={e => setAgree(e.target.checked)} />
                    <label htmlFor="agree">
                        Akceptuję regulamin i politykę prywatności platformy Kodujemy.
                    </label>
                </div>
                {errors.agree && <div className="form-error">{errors.agree}</div>}
                {errors.general && <div className="form-error" style={{marginTop:'8px'}}>{errors.general}</div>}

                <button className="btn-primary-full" onClick={submit} disabled={loading}>
                    {loading ? 'Tworzę konto...' : 'Załóż konto'}
                </button>

                <div className="auth-divider">lub</div>
                <p className="auth-switch">
                    Masz już konto? <a onClick={switchToLogin}>Zaloguj się</a>
                </p>
            </div>
        </div>
    );
}

function ProfilePage({ user, activity, setPage }) {
    const totalTasks = TASKS.length;

    const completedLessonsCount = user.completedLessons?.length || 0;

    // Poziom = XP / 200 (zaokrąglone w dół), progres do następnego
    const level = Math.floor(user.xp / 200) + 1;
    const xpInLevel = user.xp % 200;
    const xpToNext = 200 - xpInLevel;
    const levelProgress = (xpInLevel / 200) * 100;

    // Odznaki - prosta logika, prototyp gamifikacji
    const allBadges = [
        { id: 'first-task', icon: '🎯', name: 'Pierwszy krok', desc: 'Rozwiąż 1 zadanie', earned: solvedCount >= 1 },
        { id: 'five-tasks', icon: '🔥', name: 'Rozgrzewka', desc: 'Rozwiąż 5 zadań', earned: solvedCount >= 5 },
        { id: 'ten-tasks', icon: '💪', name: 'Wytrwałość', desc: 'Rozwiąż 10 zadań', earned: solvedCount >= 10 },
        { id: 'first-lesson', icon: '📚', name: 'Uczeń', desc: 'Ukończ 1 lekcję', earned: completedLessonsCount >= 1 },
        { id: 'xp-500', icon: '⭐', name: 'Zbieracz XP', desc: 'Zdobądź 500 XP', earned: user.xp >= 500 },
        { id: 'xp-1000', icon: '🌟', name: 'Mistrz XP', desc: 'Zdobądź 1000 XP', earned: user.xp >= 1000 },

        { id: 'course-done', icon: '🏆', name: 'Absolwent', desc: 'Ukończ cały kurs', earned: Object.entries(user.coursesProgress || {}).some(([cid, n]) => {
            const c = COURSES.find(x => x.id === cid);
            return c && n >= c.lessons.length;

    ];
    const earnedCount = allBadges.filter(b => b.earned).length;

    return (

            <a className="back-link" onClick={() => setPage({ name: 'dashboard' })}>← Wróć do panelu</a>

            <div className="profile-header">
                <div className="profile-avatar-big">{user.name[0]?.toUpperCase() || '?'}</div>

                    {user.email && <div className="profile-email">{user.email}</div>}

                </div>
            </div>

            <h2>Statystyki nauki</h2>
            <div className="stats-grid">
                <div className="stat-card">
                    <div className="stat-card-label">Punkty XP</div>
                    <div className="stat-card-value">{user.xp}</div>
                    <div className="stat-card-sub">Poziom {level} • {Math.round(levelProgress)}% do kolejnego</div>
                    <div className="progress-bar" style={{marginTop:'10px'}}>
                        <div className="progress-fill" style={{width: `${levelProgress}%`}}></div>
                    </div>
                </div>
                <div className="stat-card">
                    <div className="stat-card-label">Ukończone zadania</div>
                    <div className="stat-card-value">{solvedCount}</div>
                    <div className="stat-card-sub">z {totalTasks} dostępnych</div>
                </div>
                <div className="stat-card">
                    <div className="stat-card-label">Ukończone lekcje</div>
                    <div className="stat-card-value">{completedLessonsCount}</div>
                    <div className="stat-card-sub">z {totalLessons} dostępnych</div>
                </div>
                <div className="stat-card">
                    <div className="stat-card-label">Streak</div>
                    <div className="stat-card-value">🔥 {user.streak}</div>
                    <div className="stat-card-sub">dni z rzędu</div>
                </div>
                <div className="stat-card">
                    <div className="stat-card-label">Zdobyte odznaki</div>
                    <div className="stat-card-value">{earnedCount} / {allBadges.length}</div>
                    <div className="stat-card-sub">{Math.round(earnedCount / allBadges.length * 100)}% kolekcji</div>
                </div>

            <h2>Odznaki</h2>

                {allBadges.map(b => (
                    <div className={`badge-card ${b.earned ? 'earned' : 'locked'}`} key={b.id}>
                        <span className="badge-icon">{b.earned ? b.icon : '🔒'}</span>
                        <div className="badge-name">{b.name}</div>
                        <div className="badge-desc">{b.desc}</div>
                    </div>
                ))}
            </div>

            <h2>Postęp w kursach</h2>
            <div className="courses-grid" style={{marginBottom:'30px'}}>
                {COURSES.map(c => {
                    const done = user.coursesProgress?.[c.id] || 0;

                                <div className="progress-bar">
                                    <div className="progress-fill" style={{ width: `${pct}%` }}></div>
                                </div>
                            </div>
                        </div>
                    );
                })}
            </div>

            <h2>Ostatnia aktywność</h2>
            {activity.length === 0 ? (
                <div className="empty-state" style={{background:'var(--bg-panel)', border:'1px solid var(--border)', borderRadius:'var(--radius)'}}>
                    <div className="empty-state-icon">🚀</div>
                    <div>Brak aktywności. Czas zacząć rozwiązywać zadania!</div>
                </div>
            ) : (
                <div className="activity-list">
                    {activity.slice(0, 10).map((a, i) => (
                        <div className="activity-item" key={i} onClick={() => a.taskId && setPage({ name: 'editor', taskId: a.taskId })}>
                            <div className="activity-left">
                                <div className="activity-icon">{a.icon || 'Py'}</div>
                                <div className="activity-text">
                                    <h4>{a.title}</h4>
                                    <p>{a.subtitle} • {formatTime(a.timestamp)}</p>
                                </div>
                            </div>
                            <div className="activity-xp">+ {a.xp} XP</div>
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

function PlaygroundPage({ playgroundCode, setPlaygroundCode }) {
    const [code, setCode] = useState(playgroundCode || `# Witaj w edytorze kodu!
# Możesz tu eksperymentować z Pythonem — bez ograniczeń zadania.
# Wynik print() i błędy pojawią się w panelu po prawej.

print("Hello, Kodujemy!")

# Spróbuj czegoś:
for i in range(1, 6):
    print(f"Liczba {i} do kwadratu to {i * i}")
`);
    const [output, setOutput] = useState([]);
    const [running, setRunning] = useState(false);
    const [pyodideReady, setPyodideReady] = useState(!!pyodideInstance);
    const [pyodideLoading, setPyodideLoading] = useState(false);
    const lineNumbersRef = useRef(null);
    const textareaRef = useRef(null);
    const highlightRef = useRef(null);

    // Autozapis kodu z playgrounda
    useEffect(() => {
        const t = setTimeout(() => setPlaygroundCode(code), 600);
        return () => clearTimeout(t);
    }, [code]);

    // Pyodide preload
    useEffect(() => {
        if (pyodideInstance) { setPyodideReady(true); return; }
        setPyodideLoading(true);
        getPyodide().then(() => {
            setPyodideReady(true);
            setPyodideLoading(false);
        }).catch(e => {
            setPyodideLoading(false);
            setOutput([{ type: 'error', text: 'Nie udało się załadować Pythona: ' + e.message }]);
        });
    }, []);

    const onScrollTextarea = () => {
        const ta = textareaRef.current;
        if (!ta) return;
        if (lineNumbersRef.current) lineNumbersRef.current.scrollTop = ta.scrollTop;
        if (highlightRef.current) {
            highlightRef.current.scrollTop = ta.scrollTop;
            highlightRef.current.scrollLeft = ta.scrollLeft;
        }
    };

    const onKeyDownTextarea = (e) => {
        if (e.key === 'Tab') {
            e.preventDefault();
            const ta = textareaRef.current;
            const start = ta.selectionStart, end = ta.selectionEnd;
            const newCode = code.substring(0, start) + '    ' + code.substring(end);
            setCode(newCode);
            setTimeout(() => { ta.selectionStart = ta.selectionEnd = start + 4; }, 0);
        }
    };

    const runCode = async () => {
        if (!pyodideReady || running) return;
        setRunning(true);
        setOutput([{ type: 'info', text: '▶ Uruchamiam...' }]);
        try {
            const py = await getPyodide();
            // Przechwyć stdout
            py.runPython(`
import sys, io
_stdout_buf = io.StringIO()
sys.stdout = _stdout_buf
sys.stderr = _stdout_buf
`);
            let runError = null;
            try {
                py.runPython(code);
            } catch (e) {
                runError = e.message;
            }
            const out = py.runPython('_stdout_buf.getvalue()');
            py.runPython('sys.stdout = sys.__stdout__; sys.stderr = sys.__stderr__');

            const messages = [];
            if (out && out.trim()) {
                messages.push({ type: 'out', text: out });
            }
            if (runError) {
                messages.push({ type: 'error', text: runError });
            }
            if (messages.length === 0) {
                messages.push({ type: 'info', text: '(Brak wyjścia. Kod wykonał się pomyślnie.)' });
            }
            setOutput(messages);
        } catch (e) {
            setOutput([{ type: 'error', text: 'Nieoczekiwany błąd: ' + e.message }]);
        } finally {
            setRunning(false);
        }
    };

    const clearCode = () => {
        if (confirm('Wyczyścić edytor?')) setCode('');
    };

    const lineNums = Array.from({ length: Math.max(code.split('\n').length, 1) }, (_, i) => i + 1).join('\n');

    return (
        <div className="playground-page">
            <div className="playground-toolbar">
                <div>
                    <h1>💻 Edytor kodu</h1>
                    <p>Swobodny tryb — pisz i uruchamiaj kod Pythona bez ograniczeń zadania.</p>
                </div>
                <div className="header-actions">
                    <span
                        className={`header-status ${pyodideLoading ? 'loading' : pyodideReady ? 'ready' : ''}`}
                        style={{ background: '#f3f4f6', color: '#374151', border: '1px solid #e5e7eb' }}
                    >
                        <span className="dot"></span>
                        {pyodideLoading ? 'Ładowanie Pythona...' : pyodideReady ? 'Python 3 — Gotowe' : 'Oczekiwanie...'}
                    </span>
                    <button className="filter-btn" onClick={clearCode}>Wyczyść</button>
                    <button className="btn-run" onClick={runCode} disabled={!pyodideReady || running}>
                        {running ? 'Uruchamiam...' : '▶ Uruchom'}
                    </button>
                </div>
            </div>
            <div className="playground-body">
                <div className="playground-editor">
                    <div className="code-area">
                        <div className="line-numbers" ref={lineNumbersRef}>{lineNums}</div>
                        <div className="code-editor-wrap">
                            <pre
                                className="code-highlight"
                                ref={highlightRef}
                                aria-hidden="true"
                                dangerouslySetInnerHTML={{ __html: '<code>' + highlightPython(code) + '</code>' }}
                            />
                            <textarea
                                ref={textareaRef}
                                className="code-textarea"
                                value={code}
                                onChange={e => setCode(e.target.value)}
                                onScroll={onScrollTextarea}
                                onKeyDown={onKeyDownTextarea}
                                spellCheck={false}
                                autoCapitalize="off"
                                autoCorrect="off"
                            />
                        </div>
                    </div>
                </div>
                <div className="playground-output">
                    <div className="playground-output-header">Wyjście</div>
                    <div className="console-output">
                        {output.length === 0 ? (
                            <div className="console-empty">Naciśnij ▶ Uruchom, aby wykonać kod.</div>
                        ) : output.map((m, i) => (
                            <div className="console-line" key={i}>
                                {m.type === 'info' && <span className="icon-info">▶</span>}
                                {m.type === 'error' ? (
                                    <span className="console-error">{m.text}</span>
                                ) : m.type === 'out' ? (
                                    <pre style={{margin:0, whiteSpace:'pre-wrap', fontFamily:'inherit'}}>{m.text}</pre>
                                ) : (
                                    <span>{m.text}</span>
                                )}
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        </div>
    );
}

// ============================================================
// APP - root
// ============================================================
function App() {
    const [loaded, setLoaded] = useState(false);
    const [page, setPage] = useState({ name: 'dashboard' });
    const [toast, setToast] = useState(null);
    const [session, setSession] = useState(null); // { userId, name, email, token } lub null
    const [authMode, setAuthMode] = useState('login'); // 'login' | 'register' - dla niezalogowanych
    const [user, setUser] = useState({
        name: 'Gość',
        email: '',
        xp: 0,
        streak: 1,
        solvedTasks: [],
        completedLessons: [],
        coursesProgress: {},
    });
    const [activity, setActivity] = useState([]);
    const [savedCodes, setSavedCodes] = useState({});
    const [playgroundCode, setPlaygroundCode] = useState('');

    const showToast = (title, message, type = 'success') => setToast({ title, message, type });

    // applyLoadedState: ustawia stan po login/register/session
    const applyLoadedState = (data) => {
        // data: { user, activity, savedCodes }
        setUser({
            id: data.user.id,
            name: data.user.name,
            email: data.user.email,
            xp: data.user.xp || 0,
            streak: data.user.streak || 1,
            solvedTasks: data.user.solvedTasks || [],
            completedLessons: data.user.completedLessons || [],
            coursesProgress: data.user.coursesProgress || {},
        });
        setActivity(data.activity || []);
        setSavedCodes(data.savedCodes || {});
        setPlaygroundCode(data.user.playgroundCode || '');
        setSession({
            userId: data.user.id,
            name: data.user.name,
            email: data.user.email,
        });
    };

    // Bootstrap - sprawdź zapisany token sesji
    useEffect(() => {
        (async () => {
            const token = API.getToken();
            if (token) {
                try {
                    const data = await API.session();
                    applyLoadedState(data);
                } catch (e) {
                    // Token nieważny lub błąd sieci - wyczyść.
                    if (e.status === 401) {
                        API.setToken(null);
                    } else {
                        console.warn('Nie udało się przywrócić sesji:', e.message);
                    }
                }
            }
            setLoaded(true);
            // Pyodide preload w tle
            getPyodide().catch(() => {});
        })();
    }, []);

    // Autozapis kodu z playgrounda (debounce 800ms)
    useEffect(() => {
        if (!loaded || !session) return;
        const t = setTimeout(() => {
            API.savePlayground({ code: playgroundCode }).catch(e => console.warn('savePlayground:', e.message));
        }, 800);
        return () => clearTimeout(t);
    }, [playgroundCode, loaded, session]);

    const handleLogin = async (data) => {
        // data: { token, user, activity, savedCodes }
        applyLoadedState(data);
        setPage({ name: 'dashboard' });
        showToast('👋 Witaj!', `Zalogowano jako ${data.user.name}.`, 'success');
    };

    const handleLogout = async () => {
        try { await API.logout(); } catch {}
        API.setToken(null);
        setSession(null);
        setUser({
            name: 'Gość', email: '', xp: 0, streak: 1,
            solvedTasks: [], completedLessons: [], coursesProgress: {},
        });
        setActivity([]);
        setSavedCodes({});
        setPlaygroundCode('');
        setPage({ name: 'dashboard' });
        setAuthMode('login');
    };

    const solveTask = async (task) => {
        if (user.solvedTasks.includes(task.id)) {
            showToast('Zadanie już rozwiązane', 'Wszystkie testy przeszły, ale XP nie naliczamy ponownie.', 'info');
            return;
        }
        try {
            const res = await API.solveTask({
                taskId: task.id,
                title: task.title,
                category: task.category,
                xp: task.xp,
            });
            if (res.alreadySolved) {
                showToast('Zadanie już rozwiązane', 'XP nie naliczamy ponownie.', 'info');
                // Sync stanu z backendem
                setUser(u => ({ ...u, solvedTasks: [...new Set([...u.solvedTasks, task.id])] }));
                return;
            }
            setUser(u => ({
                ...u,
                xp: res.newXp,
                solvedTasks: [...u.solvedTasks, task.id]
            }));
            setActivity(a => [res.activityItem, ...a].slice(0, 30));
            showToast('🎉 Świetnie!', `Rozwiązałeś zadanie i zdobyłeś ${task.xp} XP.`, 'success');
        } catch (e) {
            showToast('Błąd zapisu', e.message, 'error');
        }
    };

    const completeLesson = async (courseId, lesson) => {
        if (user.completedLessons.includes(lesson.id)) {
            showToast('Lekcja już ukończona', 'Punkty XP zostały już naliczone.', 'info');
            return;
        }
        const course = COURSES.find(c => c.id === courseId);
        try {
            const res = await API.completeLesson({
                courseId,
                lessonId: lesson.id,
                lessonName: lesson.name,
                courseTitle: course?.title || '',
                xp: lesson.xp,
            });
            if (res.alreadyCompleted) {
                showToast('Lekcja już ukończona', 'XP nie naliczamy ponownie.', 'info');
                return;
            }
            setUser(u => ({
                ...u,
                xp: res.newXp,
                completedLessons: [...u.completedLessons, lesson.id],
                coursesProgress: { ...u.coursesProgress, [courseId]: (u.coursesProgress?.[courseId] || 0) + 1 }
            }));
            setActivity(a => [res.activityItem, ...a].slice(0, 30));
            showToast('Lekcja ukończona!', `+${lesson.xp} XP`, 'success');
        } catch (e) {
            showToast('Błąd zapisu', e.message, 'error');
        }
    };

    const saveCode = (taskId, code) => {
        // Optymistyczny update + zapis w tle (debounce ogarnięty po stronie EditorPage przez useEffect)
        setSavedCodes(prev => ({ ...prev, [taskId]: code }));
        // Tu zapis NIE jest debounceowany - więc dopiero EditorPage zadba o to.
        API.saveCode({ taskId, code }).catch(e => console.warn('saveCode:', e.message));
    };

    const solvedIds = useMemo(() => new Set(user.solvedTasks), [user.solvedTasks]);

    if (!loaded) {
        return (
            <div className="loading-screen">
                <div className="spinner"></div>
                <div className="loading-text">Ładowanie...</div>
            </div>
        );
    }

    // Niezalogowany - pokazuj formularze auth
    if (!session) {
        return authMode === 'login' ? (
            <LoginPage onLogin={handleLogin} switchToRegister={() => setAuthMode('register')} />
        ) : (
            <RegisterPage onLogin={handleLogin} switchToLogin={() => setAuthMode('login')} />
        );
    }

    return (
        <>
            <Navbar page={page} setPage={setPage} user={user} onLogout={handleLogout} />
            {page.name === 'dashboard' && <Dashboard setPage={setPage} user={user} activity={activity} />}
            {page.name === 'tasks' && <TasksPage setPage={setPage} solvedIds={solvedIds} />}
            {page.name === 'courses' && <CoursesPage setPage={setPage} user={user} />}
            {page.name === 'course' && <CourseDetail courseId={page.id} setPage={setPage} user={user} completeLesson={completeLesson} />}
            {page.name === 'editor' && <EditorPage
                taskId={page.taskId}
                setPage={setPage}
                solveTask={solveTask}
                savedCode={savedCodes[page.taskId]}
                saveCode={saveCode}
            />}
            {page.name === 'playground' && <PlaygroundPage
                playgroundCode={playgroundCode}
                setPlaygroundCode={setPlaygroundCode}
            />}
            {page.name === 'profile' && <ProfilePage user={user} activity={activity} setPage={setPage} />}
            <Toast toast={toast} onClose={() => setToast(null)} />
        </>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
